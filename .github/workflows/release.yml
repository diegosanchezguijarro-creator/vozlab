name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches vozlab/__init__.py
        shell: bash
        working-directory: client
        run: |
          code_version="$(python -c 'import re;print(re.search(r"VERSION = \"([^\"]+)\"", open("vozlab/__init__.py").read()).group(1))')"
          if [ "$code_version" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.ver.outputs.version }} does not match VERSION=$code_version in vozlab/__init__.py"
            exit 1
          fi
          echo "version $code_version OK"

      - name: Install dependencies
        working-directory: client
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: client
        run: python -m pytest tests -q

      - name: Build the app (PyInstaller)
        working-directory: client
        run: pyinstaller vozlab.spec --noconfirm

      - name: Build the installer (Inno Setup)
        working-directory: installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" vozlab.iss

      - name: Build portable zip
        shell: pwsh
        run: Compress-Archive -Path client/dist/VozLab/* -DestinationPath "client/dist/VozLab-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: VozLab ${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            installer/output/VozLab-Setup-*.exe
            client/dist/VozLab-*-portable.zip

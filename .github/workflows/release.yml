name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Windows app: PyInstaller build, Inno Setup installer, source zip, checksums
  # ---------------------------------------------------------------------------
  windows-app:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the code
        shell: bash
        working-directory: client
        run: |
          client_version="$(python -c 'import re;print(re.search(r"VERSION = \"([^\"]+)\"", open("vozlab/__init__.py").read()).group(1))')"
          server_version="$(python -c 'import re;print(re.search(r"VERSION = \"([^\"]+)\"", open("../server/server.py").read()).group(1))')"
          if [ "$client_version" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.ver.outputs.version }} does not match client VERSION=$client_version"
            exit 1
          fi
          if [ "$server_version" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.ver.outputs.version }} does not match server VERSION=$server_version"
            exit 1
          fi
          echo "version $client_version OK (client + server)"

      - name: Install dependencies
        working-directory: client
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: client
        run: python -m pytest tests -q

      - name: Build the app (PyInstaller)
        working-directory: client
        run: pyinstaller vozlab.spec --noconfirm

      - name: Build the installer (Inno Setup)
        working-directory: installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" vozlab.iss

      - name: Build portable zip
        shell: pwsh
        run: Compress-Archive -Path client/dist/VozLab/* -DestinationPath "client/dist/VozLab-${{ steps.ver.outputs.version }}-portable.zip"

      # The Smart-App-Control-safe download: source + scripts, installed via
      # installer/deploy.ps1 (no unsigned .exe involved).
      - name: Build source zip
        shell: pwsh
        run: |
          git archive --format=zip --prefix="VozLab/" -o "VozLab-${{ steps.ver.outputs.version }}-src.zip" HEAD

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(
            "installer/output/VozLab-Setup-${{ steps.ver.outputs.version }}.exe",
            "client/dist/VozLab-${{ steps.ver.outputs.version }}-portable.zip",
            "VozLab-${{ steps.ver.outputs.version }}-src.zip"
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $f)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: VozLab ${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            installer/output/VozLab-Setup-*.exe
            client/dist/VozLab-*-portable.zip
            VozLab-*-src.zip
            SHA256SUMS

  # ---------------------------------------------------------------------------
  # 2. Server image → GitHub Container Registry
  # ---------------------------------------------------------------------------
  server-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # arm64 (Raspberry Pi 5, NAS) needs emulation on the amd64 runners
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: server
          file: server/Dockerfile
          push: true
          # amd64 = GPU hosts; arm64 = Pi/NAS (CPU only: the CUDA wheels are amd64-only)
          platforms: linux/amd64,linux/arm64
          provenance: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vozlab-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/vozlab-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Supply-chain paperwork: an SBOM of everything we ship.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/vozlab-server:${{ github.ref_name }}
          artifact-name: vozlab-server.spdx.json      # one copy: the release asset below
          output-file: vozlab-server.spdx.json
          format: spdx-json
          upload-artifact: false                      # no duplicate in the run artifacts

      - name: Attach the SBOM to the release
        uses: softprops/action-gh-release@v2
        with:
          files: vozlab-server.spdx.json

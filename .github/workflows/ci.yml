name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PortAudio (Linux only — Windows wheels bundle it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        working-directory: client
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile all modules
        working-directory: client
        run: python -m compileall -q vozlab run_vozlab.py

      - name: Unit tests
        working-directory: client
        run: python -m pytest tests -q

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # the API tests need the web stack (fastapi/starlette/httpx); the heavy
      # faster-whisper import only happens lazily when the server starts
      - name: Install test dependencies
        run: pip install pytest pyyaml fastapi starlette httpx
      - name: Byte-compile server
        run: python -m compileall -q server/server.py server/cleanup.py
      - name: API + cleanup prompt + guard tests
        working-directory: server
        run: python -m pytest tests -q
      - name: Validate compose files
        working-directory: server
        run: |
          python - <<'EOF'
          import subprocess, yaml

          files = ("docker-compose.yml", "docker-compose.gpu.yml",
                   "docker-compose.full.yml", "docker-compose.full.gpu.yml")
          for f in files:
              with open(f) as fh:
                  data = yaml.safe_load(fh)
              assert "services" in data, f
              print(f"{f}: OK")

          # GPU must be opt-in: the base stacks must never request a GPU
          def render(*args):
              out = subprocess.run(["docker", "compose", *args, "config"],
                                   capture_output=True, text=True, check=True).stdout
              return out

          for base in ("docker-compose.yml", "docker-compose.full.yml"):
              rendered = render("-f", base)
              assert "gpu" not in rendered, f"{base} must not request a GPU"
              print(f"{base}: CPU-safe (no GPU request)")

          for base, gpu in (("docker-compose.yml", "docker-compose.gpu.yml"),
                            ("docker-compose.full.yml", "docker-compose.full.gpu.yml")):
              rendered = render("-f", base, "-f", gpu)
              assert "gpu" in rendered, f"{base} + {gpu} must request a GPU"
              print(f"{base} + {gpu}: GPU requested")
          EOF

  docker-image:
    name: Docker image builds (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Build only — never push from CI. This fails the PR if the Dockerfile
      # stops working on Raspberry Pi / NAS (the CUDA wheels are amd64-only).
      - name: Build both architectures
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The arm64 image must not contain CUDA wheels and must import clean
        run: |
          docker build -q --platform linux/arm64 -t vozlab-arm64-check server >/dev/null
          docker run --rm --platform linux/arm64 vozlab-arm64-check python -c "
          import importlib.util, platform
          assert platform.machine() == 'aarch64', platform.machine()
          assert importlib.util.find_spec('nvidia') is None, 'CUDA wheels leaked into arm64'
          import faster_whisper, av, uvicorn
          print('arm64 image: python stack imports, no CUDA wheels')
          "

# All-in-one Scribe stack: the dictation server + the local cleanup AI.
#
#   docker compose -f docker-compose.full.yml up -d
#
# Everything runs on your machine: Whisper (in the scribe container) and
# Ollama (the text-formatting model). No cloud, no API keys.
#
# Override the cleanup model:
#   SCRIBE_CLEANUP_MODEL=qwen2.5:3b-instruct docker compose -f docker-compose.full.yml up -d
#
# CPU-only (no NVIDIA GPU): add -f docker-compose.full.cpu.yaml

services:
  scribe:
    image: ghcr.io/diegosg-dev/scribe-server:${SCRIBE_VERSION:-latest}
    container_name: scribe
    restart: unless-stopped
    ports:
      - "8092:8080"
      - "8093:8093/udp"              # LAN discovery probes
    volumes:
      - ./data:/data
    environment:
      # the sibling ollama service, not the host
      - SCRIBE_CLEANUP_BASE_URL=http://ollama:11434
      - SCRIBE_CLEANUP_MODEL=${SCRIBE_CLEANUP_MODEL:-qwen2.5:7b-instruct}
      # the port the app should use (the published one, not the container's 8080)
      - SCRIBE_PUBLIC_PORT=8092
      # set by `install.sh --tls` through ./.env; empty means plain HTTP.
      # the VOZLAB_* fallback keeps an existing .env working after the rename
      - SCRIBE_TLS_CERT=${SCRIBE_TLS_CERT:-${VOZLAB_TLS_CERT:-}}
      - SCRIBE_TLS_KEY=${SCRIBE_TLS_KEY:-${VOZLAB_TLS_KEY:-}}

    depends_on:
      - ollama
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ollama:
    image: ollama/ollama:latest
    container_name: scribe-ollama
    restart: unless-stopped
    volumes:
      - ./ollama_data:/root/.ollama

  # One-shot helper: downloads the cleanup model on first start (~4 GB) so the
  # first dictation is not stuck waiting for a model download.
  model-preload:
    image: ollama/ollama:latest
    container_name: scribe-model-preload
    restart: "no"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL=${SCRIBE_CLEANUP_MODEL:-qwen2.5:7b-instruct}
    entrypoint: ["/bin/sh", "-c", "sleep 3; echo \"preloading $$MODEL...\"; ollama pull \"$$MODEL\"; echo done"]

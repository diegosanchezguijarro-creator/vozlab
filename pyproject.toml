[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".git", "build", "dist", "__pycache__"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (real bugs like `except ... as e` scope traps)
select = ["E", "F", "W"]
ignore = [
  "E402",  # imports after sys.path setup are normal in this project
  "E501",  # long lines are formatted by hand in the UI code
  "E731",  # lambda assignment is used for tiny tkinter callbacks
]

[tool.ruff.lint.per-file-ignores]
# the UI preview/screenshot tools only run on a workstation with a display
"client/tools/*" = ["E402", "F401"]

[tool.bandit]
exclude_dirs = ["client/tests", "server/tests", ".git", "build", "dist"]
# B310 (urllib) is only used by the local benchmark tool against a fixed URL
skips = ["B310"]

[tool.pytest.ini_options]
testpaths = ["client/tests", "server/tests"]
